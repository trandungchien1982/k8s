apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          # Replace with an image exposing /actuator/prometheus on port 8080.
          image: myregistry/orders:1.0
          ports:
            - name: http
              containerPort: 8080
