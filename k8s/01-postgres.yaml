apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: saga-demo }
data:
  init.sql: |
    CREATE DATABASE orders;
    CREATE DATABASE inventory;
    CREATE DATABASE payment;
    CREATE DATABASE shipping;
    CREATE DATABASE temporal;
    CREATE DATABASE temporal_visibility;
---
apiVersion: v1
kind: Secret
metadata: { name: postgres-secret, namespace: saga-demo }
type: Opaque
stringData: { POSTGRES_USER: saga, POSTGRES_PASSWORD: saga }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: saga-demo }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:17
        envFrom: [{ secretRef: { name: postgres-secret } }]
        env: [{ name: POSTGRES_DB, value: postgres }]
        ports: [{ containerPort: 5432 }]
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
        - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes: [{ name: init, configMap: { name: postgres-init } }]
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: saga-demo }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
