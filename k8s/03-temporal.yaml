apiVersion: apps/v1
kind: Deployment
metadata: { name: temporal, namespace: saga-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: temporal } }
  template:
    metadata: { labels: { app: temporal } }
    spec:
      containers:
      - name: temporal
        image: temporalio/auto-setup:1.28.1
        ports: [{ containerPort: 7233 }]
        env:
        - { name: DB, value: postgres12 }
        - { name: DB_PORT, value: "5432" }
        - { name: POSTGRES_USER, value: saga }
        - { name: POSTGRES_PWD, value: saga }
        - { name: POSTGRES_SEEDS, value: postgres }
---
apiVersion: v1
kind: Service
metadata: { name: temporal, namespace: saga-demo }
spec:
  selector: { app: temporal }
  ports: [{ port: 7233, targetPort: 7233 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: temporal-ui, namespace: saga-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: temporal-ui } }
  template:
    metadata: { labels: { app: temporal-ui } }
    spec:
      containers:
      - name: ui
        image: temporalio/ui:2.41.0
        env: [{ name: TEMPORAL_ADDRESS, value: temporal:7233 }]
        ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: temporal-ui, namespace: saga-demo }
spec:
  selector: { app: temporal-ui }
  ports: [{ port: 8080, targetPort: 8080 }]
