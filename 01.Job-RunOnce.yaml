
# Vi du ve trien khai Job, no se duoc chay dau tien
# Khi Job nay hoan thanh - thi ArgoCD se trigger Deployment
apiVersion: v1
kind: Namespace
metadata:
  name: test-job-then-deployment
---

# Job nay se duoc kich hoat 1 lan
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-app-db-migration
  namespace: test-job-then-deployment
  annotations:
    argocd.argoproj.io/hook: PreSync
    #argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    # Truoc khi execute job thi se tien hanh xoa Job cu (neu co)
    # HookSucceeded cung xoa Job nay khi xu ly thanh cong ...
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300

  template:
    metadata:
      labels:
        app: demo-app-db-migration
    spec:
      restartPolicy: Never

      containers:
        - name: database-migration
          image: alpine:3.20

          command:
            - /bin/sh
            - -c
            - |
              echo "Starting database migration at $(date '+%d/%b/%Y %H:%M:%S')"

              echo "Executing migration..."
              sleep 10

              echo "Database migration completed successfully"
              exit 0

