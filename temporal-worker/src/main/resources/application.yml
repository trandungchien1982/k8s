server:
  port: 8080
temporal:
  target: ${TEMPORAL_TARGET:temporal:7233}
services:
  order: ${ORDER_SERVICE_URL:http://order-service:8080}
  inventory: ${INVENTORY_SERVICE_URL:http://inventory-service:8080}
  payment: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
  shipping: ${SHIPPING_SERVICE_URL:http://shipping-service:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
