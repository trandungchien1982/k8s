apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          # Replace with an image exposing /actuator/prometheus on port 8080.
          image: myregistry/users:1.0
          ports:
            - name: http
              containerPort: 8080
